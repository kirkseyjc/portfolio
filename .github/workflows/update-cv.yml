name: Update CV from Google Docs

on:
  workflow_dispatch:

  push:
    branches:
      - main

  schedule:
    - cron: "17,47 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out portfolio
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore Google credentials
        shell: bash
        env:
          GOOGLE_CREDENTIALS_B64: ${{ secrets.GOOGLE_CREDENTIALS_B64 }}
        run: |
          printf '%s' "$GOOGLE_CREDENTIALS_B64" | base64 --decode > "$RUNNER_TEMP/google-credentials.json"

      - name: Build CV from Google Doc
        env:
          GOOGLE_DOC_ID: ${{ secrets.GOOGLE_DOC_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/google-credentials.json
        run: npm run build:cv

      - name: Prepare portfolio
        shell: bash
        run: |
          mkdir -p _site
          cp index.html academics.html media-sports.html cv.html style.css _site/
          cp -r media _site/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload portfolio
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy portfolio
        id: deployment
        uses: actions/deploy-pages@v4
