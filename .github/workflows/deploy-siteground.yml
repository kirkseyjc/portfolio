name: Deploy Portfolio to SiteGround

on:
  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create production package
        run: |
          mkdir -p deploy/media

          cp index.html deploy/
          cp academics.html deploy/
          cp media-sports.html deploy/
          cp cv.html deploy/
          cp style.css deploy/

          cp -R media/. deploy/media/

      - name: Configure SiteGround SSH
        env:
          SSH_KEY_B64: ${{ secrets.SITEGROUND_SSH_KEY_B64 }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s' "$SSH_KEY_B64" | base64 --decode > ~/.ssh/siteground_key
          chmod 600 ~/.ssh/siteground_key

          echo "Validating deployment key..."
          ssh-keygen -y -f ~/.ssh/siteground_key > /dev/null

          ssh-keyscan -p 18765 gcam1019.siteground.biz >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy directly to live portfolio
        env:
          SITEGROUND_USER: ${{ secrets.SITEGROUND_USER }}
        run: |
          set -euo pipefail

          DEST="/home/$SITEGROUND_USER/www/p1sportsmedia.com/public_html/portfolio"

          echo "Deploying directly to:"
          echo "$DEST"

          scp \
            -o IdentitiesOnly=yes \
            -i ~/.ssh/siteground_key \
            -P 18765 \
            deploy/index.html \
            deploy/academics.html \
            deploy/media-sports.html \
            deploy/cv.html \
            deploy/style.css \
            "$SITEGROUND_USER@gcam1019.siteground.biz:$DEST/"

          scp \
            -o IdentitiesOnly=yes \
            -i ~/.ssh/siteground_key \
            -P 18765 \
            -r deploy/media \
            "$SITEGROUND_USER@gcam1019.siteground.biz:$DEST/"

      - name: Verify live deployment
        env:
          SITEGROUND_USER: ${{ secrets.SITEGROUND_USER }}
        run: |
          set -euo pipefail

          DEST="/home/$SITEGROUND_USER/www/p1sportsmedia.com/public_html/portfolio"

          ssh \
            -o IdentitiesOnly=yes \
            -i ~/.ssh/siteground_key \
            -p 18765 \
            "$SITEGROUND_USER@gcam1019.siteground.biz" \
            "grep -n 'P1-Sports-Media-banner.png' '$DEST/index.html' &&
             test -f '$DEST/media/P1-Sports-Media-banner.png' &&
             echo 'LIVE PORTFOLIO VERIFIED'