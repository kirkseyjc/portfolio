name: Deploy Portfolio to SiteGround

on:
  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create production package
        run: |
          mkdir -p deploy/media

          cp index.html deploy/
          cp academics.html deploy/
          cp media-sports.html deploy/
          cp cv.html deploy/
          cp style.css deploy/

          cp -R media/. deploy/media/

      - name: Deploy portfolio to SiteGround
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.SITEGROUND_FTP_HOST }}
          username: ${{ secrets.SITEGROUND_FTP_USER }}
          password: ${{ secrets.SITEGROUND_FTP_PASSWORD }}
          port: ${{ secrets.SITEGROUND_FTP_PORT }}
          protocol: ftps
          security: loose
          local-dir: ./deploy/
          server-dir: ./
          log-level: standard
          timeout: 60000