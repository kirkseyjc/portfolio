name: Deploy Portfolio to SiteGround

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create production package
        run: |
          mkdir -p deploy/media

          cp index.html deploy/
          cp academics.html deploy/
          cp media-sports.html deploy/
          cp cv.html deploy/
          cp style.css deploy/

          cp -R media/. deploy/media/

      - name: Install FTP client
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Deploy portfolio
        env:
          FTP_HOST: ${{ secrets.SITEGROUND_FTP_HOST }}
          FTP_USER: ${{ secrets.SITEGROUND_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.SITEGROUND_FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.SITEGROUND_FTP_PORT }}
        run: |
          lftp -u "$FTP_USER","$FTP_PASSWORD" -p "$FTP_PORT" "$FTP_HOST" <<EOF
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes

          mirror \
            --reverse \
            --verbose \
            --only-newer \
            --parallel=4 \
            deploy/ .

          bye
          EOF